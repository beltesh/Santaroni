# Pushing a version tag (e.g. v1.0.0, matching pubspec.yaml) builds the
# Windows installer, the Windows portable zip and the signed Android APK, and
# creates a draft GitHub release with them to review and publish.
# See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  check:
    name: Check version, analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pubspec.yaml
        id: version
        run: |
          version=$(sed -nE 's/^version: *([0-9.]+).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows installer and zip
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./installer/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the NDK pinned in android/app/build.gradle.kts
        run: |
          ndk=$(sed -nE 's/^ *ndkVersion *= *"([^"]+)".*/\1/p' android/app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          SANTARONI_KEYSTORE: ${{ runner.temp }}/release.jks
          SANTARONI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SANTARONI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SANTARONI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          apk=build/app/outputs/flutter-apk/app-release.apk
          # Universal: runs on any device.
          flutter build apk --release
          cp "$apk" "dist/Santaroni-$VERSION-android.apk"
          # 64-bit ARM only: a third of the size, for nearly every phone
          # from the last several years. Same version code as the universal
          # one, so people can switch between them.
          flutter build apk --release --target-platform android-arm64
          cp "$apk" "dist/Santaroni-$VERSION-android-arm64.apk"
      - name: Verify the signatures
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for f in dist/*.apk; do
            "$apksigner" verify --print-certs "$f" | tee signature.txt
            if grep -q "CN=Android Debug" signature.txt; then
              echo "::error::$f is signed with the debug key"
              exit 1
            fi
          done
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Santaroni ${{ needs.check.outputs.version }}
          draft: true
          body: |
            ### Downloads
            - **Windows:** `…-windows-setup.exe` installs Santaroni (no admin rights needed). Or unzip `…-windows-portable.zip` anywhere and run `santaroni.exe`.
            - **Android:** `…-android-arm64.apk` for nearly all phones from the last several years (smaller download), or `…-android.apk` for any device. Your phone will ask you to allow installing apps from your browser or file manager.
            - `SHA256SUMS.txt` lets you check the downloads weren't altered.

            Your events and settings are kept when you update.
          generate_release_notes: true
          files: dist/*
